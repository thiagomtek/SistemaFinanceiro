# Sistema Financeiro - VM "servidor-casa". Containers: fin_app (PHP/Apache) e fin_db (MariaDB 10.5, mesma versao do erp_db).
# Banco proprio e separado do ERP. Porta publicada apenas na interface docker0 (172.17.0.1), alcancavel pelo Caddy
# via host.docker.internal e fora da LAN (mesmo padrao do remote-hub); o HTTPS e feito pelo Caddy via Tailscale.
name: sistema-financeiro

services:
  fin_db:
    image: mariadb:10.5
    container_name: fin_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-financeiro}
      MYSQL_USER: ${DB_USER:-financeiro}
      MYSQL_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?defina DB_ROOT_PASS no .env}
      TZ: America/Sao_Paulo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='-03:00'
    volumes:
      - fin_db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  fin_app:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-7.4}
    container_name: fin_app
    restart: unless-stopped
    depends_on:
      fin_db:
        condition: service_healthy
    environment:
      DB_DRIVER: mysql
      DB_HOST: fin_db
      DB_NAME: ${DB_NAME:-financeiro}
      DB_USER: ${DB_USER:-financeiro}
      DB_PASS: ${DB_PASS}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PUSH_VAPID_PUBLIC: ${PUSH_VAPID_PUBLIC:-}
      PUSH_VAPID_PRIVATE: ${PUSH_VAPID_PRIVATE:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      APP_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "172.17.0.1:${APP_PORT:-8097}:80"
    volumes:
      - fin_uploads:/var/www/uploads
      - /etc/localtime:/etc/localtime:ro

volumes:
  fin_db_data:
  fin_uploads:
