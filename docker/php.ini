date.timezone = America/Sao_Paulo
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
expose_php = Off
; erros vao para o log do contêiner, nunca para a tela (caminhos e SQL nao devem vazar)
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
; 8 h de inatividade (o padrao do PHP, ~24 min, desloga no meio do uso)
session.gc_maxlifetime = 28800
