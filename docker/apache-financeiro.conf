# Configuracao do Apache do Sistema Financeiro (o .htaccess nao vale aqui: AllowOverride None na imagem php:apache).
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Codigo de apoio e documentacao interna nao sao paginas: so o PHP os inclui pelo disco.
<DirectoryMatch "^/var/www/html/sistema/(documentacao|servicos)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(bootstrap|bd|auth_check|config_versao|config_novidades|header|footer|fatura_modais|cron_[a-z_]+)\.php$">
    Require all denied
</FilesMatch>
<FilesMatch "\.(md|sql|sqlite|log|bak|ini|env)$">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</IfModule>
